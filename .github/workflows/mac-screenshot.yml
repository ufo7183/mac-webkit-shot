name: Mac WebKit Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mac-webkit-shot

jobs:
  screenshot:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install WebKit
        run: npx playwright install webkit

      - name: Capture macOS WebKit screenshots
        run: npm run shot

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mac-webkit-screenshots
          path: screenshots/
          retention-days: 3
